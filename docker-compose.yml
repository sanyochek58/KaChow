version: '3.8'

services:

  auth-mongo:
    image: mongo:7.0
    container_name: auth-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: auth-db
    volumes:
      - auth-mongo-data:/data/db

  dealer-mongo:
    image: mongo:7.0
    container_name: dealer-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: dealer-db
    volumes:
      - dealer-mongo-data:/data/db

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - .env
    depends_on:
      - auth-mongo

  dealer-service:
    build:
      context: ./dealer-service
      dockerfile: Dockerfile
    container_name: dealer-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file:
      - .env
    depends_on:
      - dealer-mongo

volumes:
  auth-mongo-data:
  dealer-mongo-data: